services:
  db:
    image: postgres:16-alpine
    container_name: habot_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-habot}
      POSTGRES_USER: ${POSTGRES_USER:-habot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-habot_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-habot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: habot_api
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-habot}
      POSTGRES_USER: ${POSTGRES_USER:-habot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-habot_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-key}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-whsec_habot_mock_secret}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
